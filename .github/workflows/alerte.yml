name: Alerte vols

# Fonctionnement : une session vérifie les sites toutes les minutes pendant
# environ 5 h 30, puis se relance elle-même. La programmation horaire ne sert
# que de secours si la chaîne s'arrête.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [verifier, boucle]

permissions:
  contents: write # nécessaire pour que la session se relance elle-même

concurrency:
  group: alerte-vols
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      # Mémoire des messages déjà envoyés : récupérée d'une session à l'autre,
      # sinon chaque relance (toutes les 5 h 30) renverrait les mêmes ⚠️.
      - name: Récupérer la mémoire
        uses: actions/cache/restore@v4
        with:
          path: |
            .alerte_*
            .certs_*
            .anomalies
            .test_envoye
            .dossiers_*
            .ams_*
          key: memoire-${{ github.run_id }}
          restore-keys: memoire-

      - name: Vérifier toutes les minutes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for i in $(seq 1 330); do
            # Le message de test n'est envoyé qu'au premier tour d'un lancement manuel
            if [ "$i" -gt 1 ]; then export GITHUB_EVENT_NAME=boucle; fi
            echo "--- Tour $i : $(date -u)"
            # Récupère la dernière version du script à chaque tour
            git pull -q --ff-only || true
            python alerte_ams.py || true
            python alerte_vague.py || true  # deuxième vague Bénin (pour une amie)
            if [ "$i" -lt 330 ]; then sleep 60; fi
          done

      - name: Sauvegarder la mémoire
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .alerte_*
            .certs_*
            .anomalies
            .test_envoye
            .dossiers_*
            .ams_*
          key: memoire-${{ github.run_id }}

      - name: Se relancer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/dispatches -f event_type=boucle
